<main class="cadastro-container">
  <div class="cadastro-card">
    <div class="cadastro-header">
      <mat-card-title>Crie sua conta no PetSalus</mat-card-title>
      <p>É rápido, fácil e gratuito!</p>
    </div>

    <form class="cadastro-form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Nome completo</mat-label>
        <input matInput placeholder="Digite seu nome" required [(ngModel)]="nome" name="nome">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Digite seu email" required [(ngModel)]="email" name="email" type="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput placeholder="Crie uma senha" required [(ngModel)]="senha" name="senha" type="password">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar senha</mat-label>
        <input matInput placeholder="Confirme sua senha" required [(ngModel)]="confirmarSenha" name="confirmarSenha" type="password">
      </mat-form-field>

      <button mat-raised-button color="primary" class="cadastro-button" type="submit">Criar Conta</button>

      <div class="login-links">
        <a routerLink="/login"><mat-icon>arrow_back</mat-icon> Já tenho uma conta</a>
      </div>
    </form>
  </div>
</main>
