<main>
  <!-- Carrossel -->
  <div class="carousel-container">
    <div class="carousel-slides" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
      <div class="carousel-item" *ngFor="let i of [0,1,2]">
        <img class="carousel-image" src="././assets/images/pet_shop.jpg" alt="Slide {{i+1}}">

        <div class="carousel-content">
          <mat-card-title>Slide {{i + 1}}</mat-card-title>
          <p>Conteúdo descritivo e moderno do slide {{i + 1}} com design atrativo.</p>
        </div>
      </div>
    </div>
    <button mat-icon-button class="carousel-button prev" (click)="prevSlide()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button mat-icon-button class="carousel-button next" (click)="nextSlide()">
      <mat-icon>chevron_right</mat-icon>
    </button>
    <div class="carousel-indicators">
      <button *ngFor="let i of [0,1,2]" [class.active]="currentSlide === i" (click)="goToSlide(i)"></button>
    </div>
  </div>

  <!-- Área de login -->
  <div class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <mat-card-title>Bem vindo ao PetSalus!</mat-card-title>

      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput placeholder="Digite seu email" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" placeholder="Digite sua senha" required>
        </mat-form-field>

        <button mat-raised-button color="primary" class="login-button">Entrar</button>

        <div class="divider"><span>ou</span></div>

        <div class="social-login">
          <button mat-stroked-button><mat-icon>google</mat-icon> Google</button>
          <button mat-stroked-button><mat-icon>facebook</mat-icon> Facebook</button>
        </div>

        <div class="login-links">
          <a href="#"><mat-icon>help_outline</mat-icon> Esqueci a senha</a>
          <a href="#"><mat-icon>person_add</mat-icon> Criar conta</a>
        </div>
      </form>
    </div>
  </div>
</main>
